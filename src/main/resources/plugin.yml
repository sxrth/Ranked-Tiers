name: HarbourPVP
version: '${version}'
main: com.harbourpvp.ranked.HarbourPVP
api-version: '1.21'
author: HarbourPVP
description: MCPVP/PvPHQ inspired ranked PvP with kits, placements, parties, queues, arenas and kit editor.
commands:
  play:
    description: Open the HarbourPVP queue menu
  stats:
    description: View ranked statistics
  profile:
    description: View a player profile
  leaderboard:
    description: View professional kit leaderboard
    aliases: [lb, top]
  history:
    description: View match history
  profile:
    description: View a player profile
  queue:
    description: View queue status
  party:
    description: Open and manage your party
  ht:
    description: HarbourPVP administration and kit commands
    permission: harbourpvp.admin
permissions:
  harbourpvp.admin:
    default: op
